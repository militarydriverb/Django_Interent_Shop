{% extends 'base.html' %}
{% load humanize %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div class="card shadow-sm">
                    <img src="{{ car.image | default:'catalog/product_images/default_car.jpg' | media_filter }}" alt="Фото автомобиля {{ car.name }}">
                    <div class="card-body">
                        <p class="card-title"> {{ car.name }}</p>
                        <p class="card-text"> {{car.description | truncatechars:100 }}</p>
                        <p class="card-text"> price {{ car.price | intcomma }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'catalog:cars'%}" role="button">Back</a>
                                <a class="btn btn-sm btn-outline-secondary" href="{% url 'catalog:edit_product' car.pk %}" role="button">Edit</a>
                                <a class="btn btn-sm btn-outline-secondary" href="{% url 'catalog:contacts'%}" role="button">Contacts</a>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>
{% endblock %}
