{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                {% for car in cars %}
                <div class="card shadow-sm">
                    <img src="{{ car.image | default:'catalog/product_images/default_car.jpg' | media_filter }}" alt="Фото автомобиля {{ car.name }}">
                    <div class="card-body">
                        <p class="card-title"> {{ car.name }}</p>
                        <p class="card-text"> {{car.description | truncatechars:100 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'catalog:car_detail' car.pk  %}" role="button">View</a>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
