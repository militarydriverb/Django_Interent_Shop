{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p|safe }}
                </div>
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary" style="width: 160px; height: 40px;">
                       Registration
                    </button>
                    <button type="submit" class="btn btn-secondary" onclick="window.location.href='{% url 'catalog:cars' %}'" role="button">
                        Back
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
